<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สแกนป้ายฟาร์ม</title>
<style>
  :root {
    --bg: #f4f7f2; --ink: #1d2b1f; --muted: #5d6b5f; --line: #d9e2d6;
    --brand: #1f7a3d; --brand-ink: #ffffff; --warn: #8a4b00; --warn-bg: #fff4e0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11190f; --ink: #e8f0e6; --muted: #9db09f; --line: #2a3a2b;
            --brand: #3fae62; --brand-ink: #0b1a0e; --warn: #ffcf8a; --warn-bg: #3a2a10; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: "Sarabun", "Noto Sans Thai", system-ui, sans-serif;
         min-height: 100vh; display: flex; flex-direction: column; justify-content: center;
         padding: 24px 16px; }
  main { max-width: 420px; width: 100%; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 8px; }
  p { margin: 0 0 20px; color: var(--muted); line-height: 1.6; font-size: 1.05rem; }
  button { width: 100%; min-height: 64px; border: 0; border-radius: 14px; background: var(--brand);
           color: var(--brand-ink); font: inherit; font-size: 1.3rem; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #msg { margin-top: 16px; padding: 12px 14px; border-radius: 10px; background: var(--warn-bg);
         color: var(--warn); line-height: 1.5; display: none; }
  #msg.show { display: block; }
</style>
</head>
<body>
<main>
  <h1>สแกนป้ายฟาร์ม</h1>
  <p>แตะปุ่มด้านล่าง แล้วหันกล้องไปที่ QR บนป้ายบ่อ แปลง หรืออุปกรณ์</p>
  <button id="scan" type="button" disabled>เปิดกล้องสแกน</button>
  <div id="msg" role="status"></div>
</main>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="liff-scan.js"></script>
<script>
  // รหัส LIFF ได้จาก LINE Developers หลังสร้างแอป LIFF (รูปแบบ 1234567890-AbcdEfgh)
  var LIFF_ID = 'ใส่รหัส LIFF ที่นี่';

  var btn = document.getElementById('scan');
  var msg = document.getElementById('msg');
  function say(t) { msg.textContent = t; msg.className = t ? 'show' : ''; }

  async function scanOnce() {
    say('');
    btn.disabled = true;
    try {
      var r = await liff.scanCodeV2();
      var url = r && r.value ? LiffScan.scanTargetUrl(r.value) : null;
      if (!url) {
        say(r && r.value ? 'QR นี้ไม่ใช่ป้ายของระบบฟาร์ม ลองสแกนป้ายที่พิมพ์จากระบบ' : 'ยังไม่ได้สแกน ลองใหม่อีกครั้ง');
        return;
      }
      liff.openWindow({ url: url, external: false });
    } catch (e) {
      say('เปิดกล้องสแกนไม่ได้ กรุณาอนุญาตการใช้กล้องของ LINE แล้วลองใหม่');
    } finally {
      btn.disabled = false;
    }
  }

  (async function boot() {
    try {
      await liff.init({ liffId: LIFF_ID });
    } catch (e) {
      say('เปิดหน้านี้ไม่สำเร็จ กรุณาเปิดจากเมนูในแชต LINE ของฟาร์ม');
      return;
    }
    if (!liff.isInClient()) {
      say('หน้านี้ใช้ได้เฉพาะในแอป LINE กรุณาเปิดจากเมนูในแชต LINE ของฟาร์ม');
      return;
    }
    btn.disabled = false;
    btn.addEventListener('click', scanOnce);
  })();
</script>
</body>
</html>
